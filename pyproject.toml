[project]
name = "python-data-lab1"
version = "0.1.0"
description = "Лабораторная работа по обработке данных"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "polars",
    "pyarrow",
    "matplotlib"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]